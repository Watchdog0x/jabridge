name: Check Jabridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engage75_test:
        description: Build the explicitly accepted Engage 75 hardware test bundle
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Test and build
        run: |
          make fmt vet test test-static completion-check
          version="$(make -s version)-review.${GITHUB_RUN_NUMBER}"
          echo "REVIEW_VERSION=$version" >> "$GITHUB_ENV"
          review_flags="-X github.com/Watchdog0x/jabridge/internal/buildinfo.SelfUpdate=disabled -X github.com/Watchdog0x/jabridge/internal/buildinfo.Setup=disabled"
          make build VERSION="$version" EXTRA_LDFLAGS="$review_flags"
          test "$(dist/bin/jabridge --version)" = "Jabridge $version"
      - name: Check review-build installation guards
        run: |
          temporary_home="$(mktemp -d)"
          trap 'rm -rf "$temporary_home"' EXIT
          export HOME="$temporary_home"
          export JABRIDGE_HISTORY=off
          if dist/bin/jabridge setup > "$RUNNER_TEMP/review-setup.txt" 2>&1; then exit 1; fi
          if dist/bin/jabridge update > "$RUNNER_TEMP/review-update.txt" 2>&1; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/review-setup.txt")" = "jabridge: setup is managed by your package manager; use it to install Jabridge's device access rules and user service"
          test "$(cat "$RUNNER_TEMP/review-update.txt")" = "jabridge: updates are managed by your package manager; use it to update Jabridge"
          test -z "$(ls -A "$temporary_home")"
          test "$(dist/bin/jabridge --version)" = "Jabridge $REVIEW_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jabridge-linux-${{ matrix.arch }}-review
          path: dist/bin/jabridge
          retention-days: 7

  engage75-test:
    if: github.event_name == 'workflow_dispatch' && inputs.engage75_test
    needs: check
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c1cdd843b3174f96f41c83eaf0a9d1304d5f4675
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: handoff
          sparse-checkout: |
            scripts/engage75-test.sh
            scripts/test-engage75-wrapper.py
            docs/TEST_ENGAGE75.md
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/.go-version
          cache-dependency-path: engine/go.sum
      - name: Build the reviewed test engine
        run: |
          flags="-X github.com/Watchdog0x/jabridge/internal/buildinfo.SelfUpdate=disabled -X github.com/Watchdog0x/jabridge/internal/buildinfo.Setup=disabled -X github.com/Watchdog0x/jabridge/internal/firmware.Engage75Compatibility=enabled"
          make -C engine build VERSION=1.6.2-issue62.9 BUILD_DIR="$RUNNER_TEMP/engage75-test" EXTRA_LDFLAGS="$flags"
          test "$(sha256sum "$RUNNER_TEMP/engage75-test/jabridge" | cut -d ' ' -f 1)" = '51d256ae32ff6e1ad9cb15beba1a659a8a0a0e47f85c9d419affb6930c30a3c4'
      - name: Check the handoff without hardware
        run: |
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --max-time 600 --output "$RUNNER_TEMP/engage75-fixture.zip" 'https://sdkbackend.jabra.com/v4/download/1113/5.20.1'
          python3 handoff/scripts/test-engage75-wrapper.py "$RUNNER_TEMP/engage75-fixture.zip" --report "$RUNNER_TEMP/engage75-wrapper-tests.json"
      - name: Package the one-command test
        run: |
          cp handoff/scripts/engage75-test.sh "$RUNNER_TEMP/engage75-test/test-engage75.sh"
          cp handoff/docs/TEST_ENGAGE75.md "$RUNNER_TEMP/engage75-test/README.md"
          cp engine/LICENSE "$RUNNER_TEMP/engage75-test/LICENSE"
          "$RUNNER_TEMP/engage75-test/jabridge" --licenses > "$RUNNER_TEMP/engage75-test/THIRD_PARTY_NOTICES.txt"
          cd "$RUNNER_TEMP/engage75-test"
          sha256sum jabridge test-engage75.sh README.md LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jabridge-engage75-test-linux-amd64
          path: ${{ runner.temp }}/engage75-test/
          retention-days: 30
