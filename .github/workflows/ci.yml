name: Check Jabridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Test and build
        run: |
          make fmt vet test test-static completion-check
          make build
          test "$(dist/bin/jabridge --version)" = "Jabridge $(make -s version)"
      - name: Build arm64
        run: GOOS=linux GOARCH=arm64 make build BUILD_DIR=dist/arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jabridge-linux-amd64-review
          path: dist/bin/jabridge
          retention-days: 7
