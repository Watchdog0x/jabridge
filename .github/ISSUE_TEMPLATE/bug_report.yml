name: Bug Report
description: Report a bug or unexpected behavior in Jabridge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below to help us investigate.

  - type: input
    id: version
    attributes:
      label: Jabridge Version
      description: What version or commit of Jabridge are you running?
      placeholder: "e.g., 1.0.0 or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Linux Distribution
      description: Which Linux distribution are you using?
      options:
        - Ubuntu
        - Debian
        - Fedora
        - CentOS / RHEL
        - Arch Linux
        - Manjaro
        - openSUSE
        - Other (please specify in description)
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel Version
      description: Output of `uname -r`
      placeholder: "e.g., 6.5.0-35-generic"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Jabra Device(s)
      description: Which Jabra device(s) are you using?
      placeholder: "e.g., Jabra Link 380 + Jabra Evolve2 85"
    validations:
      required: true

  - type: input
    id: usb-id
    attributes:
      label: VID:PID and connection type
      description: Include VID:PID and USB/dongle/BT connection type. Redact serial numbers.
      placeholder: "e.g., 0b0e:24c7, USB dongle"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      description: How did you install Jabridge?
      options:
        - curl/wget installer (install.sh)
        - RPM package
        - DEB package
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run jabridge
        2. Navigate to '...'
        3. Press '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Terminal Output
      description: Any relevant logs or terminal output. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, related issues, etc.)
    validations:
      required: false
