version: "2"

linters:
  default: standard
  # The protocol layer keeps parity fields and future handlers that are not
  # wired into the preview yet. Cleanup-error debt is tracked separately.
  disable:
    - errcheck
    - unused

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true
