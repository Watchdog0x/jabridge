<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">One Jabridge service for your menu, commands and apps</title>
  <desc id="desc">The terminal menu, CLI and a custom desktop frontend exchange requests and events through a private JSON-RPC socket with Jabridge. The service controls USB and Link-connected devices and PipeWire sound. Firmware installation is a separate exclusive workflow.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#16857c" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="660" rx="22" fill="#f4f8fa"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#182c3c">
    <text x="48" y="58" font-size="28" font-weight="700">One service. Your choice of interface.</text>
    <text x="48" y="90" font-size="17" fill="#486271">Start with: jabridge service start</text>
    <g fill="#fff" stroke="#c3d3da" stroke-width="2"><rect x="48" y="126" width="256" height="110" rx="14"/><rect x="352" y="126" width="256" height="110" rx="14"/><rect x="656" y="126" width="256" height="110" rx="14"/></g>
    <g text-anchor="middle">
      <text x="176" y="170" font-size="22" font-weight="700">Terminal menu</text><text x="176" y="203" font-size="17">jabridge</text>
      <text x="480" y="170" font-size="22" font-weight="700">Commands</text><text x="480" y="203" font-size="17">jabridge ipc devices</text>
      <text x="784" y="170" font-size="22" font-weight="700">Your app</text><text x="784" y="203" font-size="16">GNOME · KDE · Hyprland</text>
    </g>
    <g fill="none" stroke="#16857c" stroke-width="2.5"><path d="M176 247V278H784V247"/><path d="M480 247V325" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
    <text x="504" y="305" font-size="16" fill="#28645f">Private socket · JSON-RPC 2.0</text>
    <rect x="216" y="338" width="528" height="116" rx="16" fill="#153b47"/>
    <text x="480" y="381" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Jabridge service</text>
    <text x="480" y="415" text-anchor="middle" font-size="17" fill="#c4ece7">Reads, user changes and device events</text>
    <g fill="none" stroke="#16857c" stroke-width="2.5"><path d="M480 454V480H248V506" marker-end="url(#arrow)"/><path d="M480 480H712V506" marker-end="url(#arrow)"/></g>
    <g fill="#fff" stroke="#c3d3da" stroke-width="2"><rect x="48" y="517" width="400" height="83" rx="14"/><rect x="512" y="517" width="400" height="83" rx="14"/></g>
    <text x="248" y="552" text-anchor="middle" font-size="20" font-weight="700">Headset / Link / call controller</text><text x="248" y="579" text-anchor="middle" font-size="16">USB and through-dongle control</text>
    <text x="712" y="552" text-anchor="middle" font-size="20" font-weight="700">PipeWire sound</text><text x="712" y="579" text-anchor="middle" font-size="16">Speakers, microphone and call activity</text>
    <text x="480" y="635" text-anchor="middle" font-size="15" fill="#486271">Firmware installation is a separate, exclusive workflow. Features depend on the device.</text>
  </g>
</svg>
